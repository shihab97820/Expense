<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>হিসাব খাতা</title>
<meta name="theme-color" content="#060a14">
<meta name="description" content="আয়, খরচ ও বাজারদরের ব্যক্তিগত হিসাব খাতা">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Red+Hat+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, trustworthy household ledger; numbers first, Bengali first
   IDEA: a pocket hisab khata (ledger) that also remembers bazaar prices year by year
   PICTURE: the deep-blue balance card and live charts drawn from real entries
   COLOUR and TYPE: navy ground, teal income, red-orange expense, yellow highlight; Hind Siliguri + Red Hat Display figures
   LAYOUT: one phone column, sticky header, bottom navigation, slide-up entry sheet */
:root{color-scheme:light dark;--bg:light-dark(#f2f5f9,#060a14);--card:light-dark(#fff,#0d1426);--line:light-dark(#e1e6ef,#1a2440);--ink:light-dark(#0a1124,#e8edf8);--mut:light-dark(#5b6683,#8a96b6);--inc:light-dark(#0e8a5f,#34d399);--exp:light-dark(#c3361f,#ff8f80);--hi:#f7e463;--blue:light-dark(#0e8a5f,#34d399);--on:light-dark(#fff,#04130d);--field:light-dark(#f5f7fb,#0a1020);--glow:light-dark(#0e8a5f22,#34d39926)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Hind Siliguri',system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:460px;margin:0 auto;min-height:100dvh;padding-bottom:150px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:22px;line-height:1.1}.top small{color:var(--mut);font-size:13px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;min-height:36px;cursor:pointer;white-space:nowrap}
.pill.ok{color:var(--inc)}.pill.wait{color:#d4a72c}.pill.off{color:var(--exp)}
main{padding:12px 14px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h2{margin:0 0 8px;font-size:17px}.card h3{margin:12px 0 4px;font-size:15px;color:var(--mut)}
.mut{color:var(--mut);font-size:14px;margin:6px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{position:relative;overflow:hidden;color:#eef3ff;border-radius:24px;padding:20px 18px 16px;border:1px solid #22305a;background:radial-gradient(120% 90% at 100% 0%,#34d39929 0%,transparent 55%),linear-gradient(165deg,#111a33 0%,#0a1022 60%,#070b17 100%);box-shadow:0 18px 40px -22px #000c,inset 0 1px 0 #ffffff12;animation:rise .45s ease-out both}
.htop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:#a9b5d6}
.badge{flex:none;font-size:12.5px;font-weight:600;color:#34d399;background:#34d3991f;border:1px solid #34d39947;border-radius:99px;padding:2px 10px}.badge.neg{color:#ff9b8c;background:#ff8f801f;border-color:#ff8f8047}
.big{font:800 clamp(38px,11.5vw,50px)/1.05 'Red Hat Display','Hind Siliguri',sans-serif;letter-spacing:-.5px;margin:8px 0 14px;white-space:nowrap;color:#fff}.big.neg{color:#ff9b8c}
.meter{height:7px;border-radius:9px;background:#ffffff14;overflow:hidden}.meter i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#1fa97a,#34d399);border-radius:9px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.sub{display:block;margin-top:6px;font-size:13px;color:#8f9cbf}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.tile{background:#ffffff0a;border:1px solid #ffffff14;border-radius:16px;padding:12px;display:grid;gap:2px}.tile small{font-size:13px;color:#a9b5d6}.tile b{font:700 clamp(17px,5vw,20px)/1.2 'Red Hat Display','Hind Siliguri',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.ti{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;margin-bottom:6px}.ti svg,.qi svg,.ic svg,.link svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ti.in{background:#34d39924;color:#34d399}.ti.out{background:#ff8f8024;color:#ff9b8c}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed #ffffff1c;font-size:13px;color:#8f9cbf}.foot span{display:grid}.foot span:last-child{text-align:end}.foot b{font-size:15px;color:#e8edf8;white-space:nowrap}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;animation:rise .45s .08s ease-out both}
.qa button{display:grid;justify-items:center;gap:6px;min-height:84px;padding:12px 6px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px;cursor:pointer;transition:transform .12s,border-color .2s}
.qa button:active,.tx:active,.btn:active{transform:scale(.97)}.qa button:hover{border-color:var(--blue)}
.qi{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--glow);color:var(--blue)}.qi.out{background:color-mix(in srgb,var(--exp) 16%,transparent);color:var(--exp)}.qi.in{background:color-mix(in srgb,var(--inc) 16%,transparent);color:var(--inc)}
.link svg{width:16px;height:16px;vertical-align:-3px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes grow{from{width:0}}
@media(prefers-reduced-motion:reduce){.hero,.qa,.meter i{animation:none}.qa button,.tx,.btn{transition:none}}
.banner{background:color-mix(in srgb,#f7e463 10%,var(--card));border:1px solid color-mix(in srgb,#f7e463 35%,var(--line));border-radius:14px;padding:10px 12px;font-size:14px}
.tx{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;text-align:start;cursor:pointer;min-height:60px;border-radius:10px;transition:transform .12s}
.tx:first-of-type{border-top:0}
.ic{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center}.ic.expense{background:color-mix(in srgb,var(--exp) 14%,transparent);color:var(--exp)}.ic.income{background:color-mix(in srgb,var(--inc) 14%,transparent);color:var(--inc)}
.amtw{display:grid;justify-items:end;flex:none}.amtw small{font-size:12px;color:var(--mut)}
.mid{flex:1;display:grid}.mid b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mid small{color:var(--mut);font-size:13px}
.amt{font-weight:700;white-space:nowrap}.amt.expense,.exp{color:var(--exp)}.amt.income,.inc{color:var(--inc)}
.pend{color:#b88a00;font-style:normal}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:14px 2px 2px;font-weight:600}
.fig{position:relative;height:220px}.fig.sm{height:160px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg text{fill:var(--mut);font:12px 'Hind Siliguri',sans-serif}svg .gl{stroke:var(--line)}
svg .b-inc{fill:var(--inc)}svg .b-exp{fill:var(--exp)}svg .ln{fill:none;stroke:var(--blue);stroke-width:2.5}svg .ar{fill:var(--blue);opacity:.12}svg .pt{fill:var(--card);stroke:var(--blue);stroke-width:2.5}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.filters{display:grid;gap:8px}
.frow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.frow>*{flex:1 1 130px}
input,select,textarea{min-height:44px;font-size:16px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px 12px;width:100%}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,monospace}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.btn{min-height:44px;border:0;border-radius:12px;background:var(--blue);color:var(--on);font-weight:600;padding:8px 16px;cursor:pointer;transition:transform .12s}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:var(--exp)}
.link{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;padding:6px 2px;min-height:36px}
.qrow{display:flex;gap:8px}.qrow input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{border:1px solid var(--line);background:var(--field);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:38px}.chip.on{background:var(--blue);color:var(--on);border-color:var(--blue)}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:40px;cursor:pointer;font-weight:600}.seg button.on{background:var(--blue);color:var(--on)}
.seg.tt button.on[data-v=expense]{background:var(--exp)}.seg.tt button.on[data-v=income]{background:var(--inc)}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat div{background:var(--field);border-radius:12px;padding:10px}.stat small{color:var(--mut);font-size:13px}.stat b{display:block;font-size:18px;white-space:nowrap}
.cbar{margin-top:10px}.cl{display:flex;justify-content:space-between;font-size:14px}.track{height:10px;background:var(--field);border-radius:6px;overflow:hidden;margin-top:3px}.track i{display:block;height:100%;background:var(--exp);border-radius:6px}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:14px;align-items:center}.cmp b{text-align:end;white-space:nowrap}.cmp .h{color:var(--mut);font-size:13px}
.yr{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}.yr>span{grid-row:span 3;font:800 18px 'Red Hat Display','Hind Siliguri';color:var(--mut)}.yr.now>span{color:var(--blue)}.yr b{font-size:18px}.yr small{color:var(--mut);font-size:13px}
.yr.miss b{font-size:15px;color:var(--mut);font-weight:500}
.diff{font-size:15px}.diff.up{color:var(--exp)}.diff.down{color:var(--inc)}
.askbox{background:#f7e46326;border:1px solid #c9b52a;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}.askbox .chips{margin-top:6px}.okn{color:var(--inc);font-size:14px;margin-top:4px}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;animation:rise .45s .12s ease-out both}.tools button{display:flex;align-items:center;gap:10px;text-align:start;padding:12px;min-height:64px;border-radius:18px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .12s}.tools button:active{transform:scale(.97)}.tools .qi{flex:none}.tools b{font-size:14.5px}
.duo2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.duo2 b{display:block;font:800 clamp(20px,6vw,26px)/1.2 'Red Hat Display','Hind Siliguri';white-space:nowrap}
.loan{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:6px}.loan:first-of-type{border-top:0}.loan summary{cursor:pointer;color:var(--mut);font-size:14px;min-height:32px}
.shop{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}.shop:first-of-type{border-top:0}.shop.done .mid b{text-decoration:line-through;color:var(--mut)}
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--blue);background:none;cursor:pointer;display:grid;place-items:center;color:var(--on);padding:0}.shop.done .ck{background:var(--inc);border-color:var(--inc)}.ck svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3}
.x{flex:none;width:40px;height:40px;border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer}
.hero.sm .big{font-size:clamp(30px,9vw,40px);margin-bottom:6px}
.phrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.phrow img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}.phbtn{display:inline-flex;align-items:center;cursor:pointer}
.camb svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;vertical-align:-2px;margin-inline-end:4px}
.pv{align-items:center;z-index:35;cursor:zoom-out}.pv img{max-width:94vw;max-height:88dvh;border-radius:12px}
.back{justify-self:start}
.empty{background:var(--field);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:14px;margin-top:8px}
.hrow{display:grid;grid-template-columns:1fr auto;gap:0 10px;border-top:1px solid var(--line);padding:8px 0;font-size:14px}.hrow small{color:var(--mut)}.hrow b{text-align:end;white-space:nowrap}
.catl{display:flex;flex-wrap:wrap;gap:6px}.catl span{display:inline-flex;align-items:center;gap:2px;background:var(--field);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 12px;font-size:14px}.catl button{border:0;background:none;width:32px;height:32px;cursor:pointer;color:var(--mut);font-size:18px}
.fld{display:grid;gap:4px;margin-top:10px}.fld>span{font-size:14px;color:var(--mut)}
.sw{display:flex;gap:10px;align-items:center;min-height:44px}.sw input{width:22px;height:22px;min-height:0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 2px;font-size:12px;color:var(--mut);cursor:pointer;min-height:58px}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}nav button.on{color:var(--blue);font-weight:700}nav button.on svg{background:var(--glow);border-radius:10px;padding:2px 10px;width:42px;box-sizing:content-box}
#fab{position:fixed;bottom:76px;right:max(16px,calc(50% - 214px));width:60px;height:60px;border-radius:20px;border:0;background:linear-gradient(150deg,#4be3a7,#1fa97a);color:#04130d;font-size:34px;line-height:1;box-shadow:0 8px 20px -6px #0007;z-index:7;cursor:pointer}
.ov{position:fixed;inset:0;background:#0b1433b0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:min(460px,100%);max-height:94dvh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px 24px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0;font-size:20px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.amtIn{font:800 28px 'Red Hat Display','Hind Siliguri';min-height:56px}
.preview{font-size:14px;color:var(--inc);min-height:22px;margin-top:4px}
.voice{display:flex;gap:8px;margin-top:10px}.voice input{flex:1}.mic{flex:none;width:48px;border-radius:12px;border:1px solid var(--line);background:var(--field);cursor:pointer}
.mic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.mbox{background:var(--card);border-radius:18px;padding:18px;margin:auto 16px;width:min(420px,100%);align-self:center}
.mbox h2{margin:0 0 6px;font-size:18px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#0b1433;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:min(420px,92vw);box-shadow:0 8px 20px #0005}
#auth{position:fixed;inset:0;z-index:45;background:radial-gradient(120% 70% at 100% 0%,#34d39926,transparent 60%),#060a14;color:#e8edf8;display:grid;place-items:center;overflow:auto;padding:20px 0}.abox{width:min(400px,92vw);background:#0d1426;border:1px solid #1a2440;border-radius:22px;padding:22px 18px}.abox img{display:block;border-radius:16px;margin-bottom:8px}.abox h2{margin:0;font-size:24px}.abox input{background:#0a1020;border-color:#1a2440;color:#e8edf8}.abox .fld>span{color:#8a96b6}.amsg{min-height:22px;font-size:14px;color:#ffb3a3;margin:8px 0 0}
#lock{position:fixed;inset:0;z-index:40;background:linear-gradient(160deg,#3b4fd8,#0b1433);display:grid;place-items:center;color:#fff}
#lock .mbox{background:#121d45;color:#fff;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header class="top"><div><small id="hSub"></small><h1 id="hTitle">হোম</h1></div><button class="pill" id="pill" data-act="go" data-v="set"></button></header>
  <main id="view"></main>
</div>
<button id="fab" data-act="add" aria-label="নতুন লেনদেন">+</button>
<nav id="nav">
  <button data-act="go" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i="home">হোম</span></button>
  <button data-act="go" data-v="list"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></svg><span data-i="list">লেনদেন</span></button>
  <button data-act="go" data-v="price"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8M15 8h5v5"/></svg><span data-i="price">দাম</span></button>
  <button data-act="go" data-v="report"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i="report">রিপোর্ট</span></button>
  <button data-act="go" data-v="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg><span data-i="set">সেটিংস</span></button>
</nav>

<div class="ov" id="sheetOv" hidden>
  <form class="sheet" id="txForm" novalidate>
    <div class="row"><h2 id="shT">নতুন লেনদেন</h2><button type="button" class="link" data-act="close">বন্ধ</button></div>
    <div class="seg tt" id="fType" data-v="expense" style="margin-top:10px"><button type="button" data-act="ftype" data-v="expense" class="on">খরচ</button><button type="button" data-act="ftype" data-v="income">আয়</button></div>
    <div class="voice"><input id="fQuick" placeholder="দ্রুত লিখুন: alu 2 kg 40 taka / আলু ২ কেজি ৪০ টাকা"><button type="button" class="mic" data-act="mic" aria-label="ভয়েস"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="link" data-act="quick">লেখা থেকে ঘর পূরণ করুন</button></div>
    <label class="fld"><span>মোট টাকা (৳) *</span><input id="fAmt" class="amtIn" inputmode="text" autocomplete="off" placeholder="০ (যেমন 40, ৪০, chollish)"></label>

function buildIdx(){IDX={i:new Map(),c:new Map()};FUZ=[];KC.clear();

  const gw=iw/n,sk=Math.ceil(n/Math.max(1,Math.floor(iw/46)));

  copy:b=>{const el=$(b.dataset.t);try{navigator.clipboard.writeText(el.value).then(()=>toast('কপি হয়েছে'),()=>{el.select();toast('অটো-কপি হয়নি — লেখাটি সিলেক্ট করা আছে, চেপে ধরে কপি করুন')})}catch(e){el.select();toast('লেখাটি চেপে ধরে কপি করুন')}},
  pinOn:()=>{const v=toEn($('#pinIn').value);if(!/^\d{4,6}$/.test(v))return toast('PIN ৪ থেকে ৬ সংখ্যার হতে হবে।');S.settings.pin=v;save();toast('PIN চালু হয়েছে');render()},
  pinOff:()=>ask('PIN বন্ধ করবেন?','অ্যাপ খুলতে আর PIN লাগবে না।','বন্ধ করুন',()=>{S.settings.pin='';save();render()}),
  unlock:()=>{if(toEn($('#lockIn').value)===S.settings.pin){$('#lock').hidden=true;$('#lockIn').value=''}else{$('#lockMsg').textContent='ভুল PIN, আবার চেষ্টা করুন।';$('#lockIn').value=''}},
  clearDemo:()=>ask('ডেমো ডেটা মুছবেন?','শুধু নমুনা লেনদেন মুছবে; আপনার নিজের যোগ করা লেনদেন থাকবে।','মুছুন',()=>{S.tx=S.tx.filter(t=>!t.demo);P.res='';save();render()}),
  loadDemo:()=>{const ids=new Set(S.tx.map(t=>t.id));S.tx.push(...demo().filter(t=>!ids.has(t.id)));save();render()},
  clearAll:()=>ask('সব ডেটা মুছবেন?','সব লেনদেন, ধার-দেনা, বাজারের তালিকা আর রসিদের ছবি স্থায়ীভাবে মুছে যাবে। আগে ব্যাকআপ নিয়ে রাখুন। নিশ্চিত হলে নিচে “মুছুন” লিখুন।','সব মুছুন',()=>{S.tx=[];S.deleted=[];S.loans=[];S.shop=[];PDB.clear().catch(()=>{});P.res='';save();toast('সব ডেটা মুছে ফেলা হয়েছে');render()},'মুছুন'),
  mNo:()=>{$('#modal').hidden=true},mOk:()=>{if(needWord&&$('#mIn').value.trim()!==needWord)return toast('নিশ্চিত করতে “'+needWord+'” লিখুন।');$('#modal').hidden=true;modalCb&&modalCb()}};

/* ফোনের ব্যাক বাটন: প্রতিটা স্ক্রিন বা পপআপ খুললে history-তে একটা ধাপ যোগ হয়; ব্যাক চাপলে উপরের ধাপটা বন্ধ হয়ে আগের স্ক্রিনে ফেরে;
   হোমে কিছু খোলা না থাকলে প্রথম ব্যাকে সতর্কবার্তা, দ্বিতীয় ব্যাকে অ্যাপ থেকে বের হওয়া।
   history-র ধাপগুলোতে শুধু গভীরতা (hk) থাকে: ০ = বেস, ১ = হোম-গার্ড, তার উপরে প্রতিটা খোলা স্ক্রিন/পপআপ।
   (এই কোডে history() নামে দামের-ইতিহাস ফাংশন আছে, তাই ব্রাউজারের history = WH) */
var NAV={st:[],view:'home',expect:null,wait:0};
const WH=window.history;
const NAVOV=[['#sheetOv',()=>closeSheet()],['#modal',()=>{$('#modal').hidden=true}],['#pv',()=>{$('#pv').hidden=true}]];
function navDepth(){return 1+NAV.st.length}
function navHk(){const s=WH.state;return s&&typeof s.hk==='number'?s.hk:0}
function navGuard(){if(NAV.expect==null&&navHk()<1)WH.pushState({hk:1},'')}
function navPush(l){NAV.st.push(l);if(NAV.expect!=null){NAV.wait++;return}navGuard();WH.pushState({hk:navDepth()},'')}
/* কোড থেকে বন্ধ হওয়া ধাপগুলো সরাও (বোতাম, সেভ, Escape ইত্যাদি) — history থেকেও ততগুলো ধাপ পিছিয়ে যাও */
function navDrop(test){let n=0;for(let i=NAV.st.length-1;i>=0;i--){if(!test(NAV.st[i]))continue;const unpushed=i>=NAV.st.length-NAV.wait;NAV.st.splice(i,1);if(unpushed)NAV.wait--;else n++}
  if(!n)return;NAV.expect=(NAV.expect!=null?NAV.expect:navHk())-n;WH.go(-n)}
function navSync(){navDrop(l=>l.el&&l.el.hidden);NAVOV.forEach(([sel,close])=>{const el=$(sel);if(!el.hidden&&!NAV.st.some(l=>l.el===el))navPush({el,close})})}
function navTrack(){if(!NAV||NAV.view===view)return;const prev=NAV.view;NAV.view=view;
  if(view==='home')return navDrop(l=>!l.el);
  navPush({prev,close:()=>{view=prev;NAV.view=prev;window.scrollTo(0,0);render()}})}
addEventListener('popstate',e=>{const d=e.state&&typeof e.state.hk==='number'?e.state.hk:0;
  if(NAV.expect!=null){if(d>NAV.expect)return;const mine=d===NAV.expect;NAV.expect=null;const w=NAV.wait;NAV.wait=0;
    if(mine){for(let i=w;i>0;i--)WH.pushState({hk:navDepth()-i+1},'');return}}
  let popped=false;while(navDepth()>Math.max(d,1)){const l=NAV.st.pop();popped=true;l.close()}
  if(d>0)return;
  if(popped)return WH.pushState({hk:1},'');
  toast(L()==='en'?'Press back again to exit':'বের হতে আবার ব্যাক চাপুন',2000)});
/* প্রথম ব্যাকের পর ব্যবহারকারী আবার কিছু চাপলে হোম-গার্ড ফেরত আসে */
addEventListener('click',navGuard,true);addEventListener('keydown',navGuard,true);
NAVOV.forEach(([sel])=>new MutationObserver(navSync).observe($(sel),{attributes:true,attributeFilter:['hidden']}));
WH.replaceState({hk:0},'');WH.pushState({hk:1},'');

  try{if(navigator.storage&&navigator.storage.persist)persisted=(await navigator.storage.persisted())||(await navigator.storage.persist())}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
}
